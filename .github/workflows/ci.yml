name: Python CI

on:
  push:
    branches: [main]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest